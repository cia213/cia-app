name: verify

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    env:
      # Source-only checks compile with tracked resources. Release builds retain
      # the complete resource list in tauri.conf.json.
      TAURI_CONFIG: '{"bundle":{"resources":["resources/time_remap.py","resources/rife_worker.py","resources/bootstrap/bootstrap-rife.ps1"]}}'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: python -m unittest discover -s tests -v
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Installer builds require a separately reviewed release payload and signing
      # key. A source-only pull request must not manufacture either of them.
