name: verify

on:
  push:
  pull_request:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - run: npm ci
      - run: npm run build
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - name: Ensure Signing Key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            $keyDir = "$env:USERPROFILE\.tauri"
            if (!(Test-Path $keyDir)) { New-Item -ItemType Directory -Force -Path $keyDir | Out-Null }
            npx tauri signer generate -w "$keyDir\ci.key" -f --ci
            $keyContent = Get-Content "$keyDir\ci.key" -Raw
            echo "TAURI_SIGNING_PRIVATE_KEY=$keyContent" >> $env:GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $env:GITHUB_ENV
          }
      - run: npm run tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: cia-render-nsis
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
