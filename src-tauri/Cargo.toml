[package]
name = "cia-render"
version = "1.0.0"
edition = "2021"

[lib]
name = "cia_render_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "process", "io-util"] }
rfd = "0.15"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
