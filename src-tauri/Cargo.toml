[package]
name = "cia-render"
version = "1.0.2"
edition = "2021"
description = "Local Windows video rendering with smoothie-rs and optional RIFE interpolation."
repository = "https://github.com/cia213/cia-app"
license = "MIT"

[lib]
name = "cia_render_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt", "rt-multi-thread", "process", "io-util"] }
rfd = "0.15"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }
